okf_version: "0.2"

base:
  name: "okflint"
  roots:
    - path: "."
      exclude_patterns:
        - ".venv/**"
        - ".git/**"
        - "worktrees/**"
        - ".claude/worktrees/**"
        - .pytest_cache/**
        - ".mypy_cache/**"
        - ".ruff_cache/**"
        - tests/**
        - "docs/_templates/**"
  reserved_files:
    index: "index.md"
    log: "log.md"
  link_resolution:
    scope: base
    external_refs: []

profile:
  date_fields: [created, updated]
  types:
    ProjectDescription:
      # README.md — descriptive project documentation, human/consumer-facing.
      # Answers "what is it, how to use it".
      required: [project]
      optional: [updated, tags]

    ProjectStandards:
      # CLAUDE.md, CONTRIBUTING.md — prescriptive project contract,
      # agent/contributor-facing. Answers "how to work on it".
      required: [project]
      optional: [updated, tags]

    ProjectLifeCycle:
      # CHANGELOG.md, ROADMAP.md — project evolution documents.
      # status required: active (living document) or archived (frozen project).
      required: [project, status]
      optional: [updated, tags]
      status_values: [active, archived]

    ProjectJournal:
      # .claude/DECISIONS.md, .claude/LESSONS.md — project running log.
      # Architectural decisions and lessons learned accumulated across sessions.
      # No status: living document, never archived independently of the project.
      required: [project]
      optional: [updated, tags]

    Command:
      # .claude/commands/*.md — Claude Code slash-command definitions.
      required: [description]
      optional: [argument-hint]

    Spec:
      # docs/specs/*.md — business need documented before implementation.
      required: [id, title, description, status, timestamp, perimeter]
      optional: [superseded-by, work-item, tags, audience]
      status_values: [draft, accepted, implemented, superseded]

    Fix:
      # docs/fixes/*.md — malfunction, root cause, resolution.
      required: [id, title, description, status, severity, timestamp, perimeter]
      optional: [work-item, tags, audience]
      status_values: [draft, confirmed, fixed, wontfix]
      severity_values: [blocker, major, minor]

    Plan:
      # docs/plans/*.md — implementation procedure for a Spec or a Fix.
      required:
        [id, title, description, status, implements, timestamp, perimeter]
      optional: [tags, audience]
      status_values: [draft, active, done, deprecated]

hygiene:
  broken_links: warn
  split_candidates: off

  # Optional sub-block tuning the S202 gate. Omit entirely to keep every
  # default below.
  split:
    min_lines: 300 # skip files shorter than this many lines
    exempt_types: [README.md] # profile type names (e.g. [Reference]) never checked
  #   exempt_paths: []       # glob patterns (fnmatch) never checked
  #   tau: 0.15              # cosine similarity threshold for cohesion clustering.
  #                          # Advanced — leave the default unless you understand
  #                          # the cosine clustering; higher = more fragmentation.

  reserved_files: error
  unknown_fields: error
  okf_v02_shapes: warn
  legacy_forms: warn
  stale_content: warn
